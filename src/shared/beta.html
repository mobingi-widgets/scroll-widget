<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>베타 받기</title>
<link rel="stylesheet" href="update.css">
</head>
<body>
<div id="card">
  <h1 id="title">베타 받기</h1>
  <ul id="warn">
    <li>베타는 정식 전 시험판입니다.</li>
    <li>앱이 멈추거나 기능이 망가지는 등 문제가 생길 수 있습니다.</li>
    <li>옛 판으로 자동으로 되돌리지 않습니다 — 문제가 생기면 정식 전체 설치본(full.zip)으로 다시 설치하세요.</li>
    <li><b>자동</b>이 켜져 있으면 베타도 새 버전 알림으로 뜹니다. 설치는 직접 누를 때만 합니다.</li>
  </ul>
  <div id="row">
    <span class="grow"></span>
    <button id="no" class="ghost">취소</button>
    <button id="yes" class="primary">동의하고 켜기</button>
  </div>
</div>
<script src="beta.js"></script>
</body>
</html>
