<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>주간 납품 툴팁</title>
<style>
  /* One tooltip for every badge: small type, tight lines, aligned numbers. It sits in
     its own click-through window beside the overlay, so it is never cut off. */
  * { box-sizing: border-box; }
  :root { --text: 1; }      /* 글자 % (main.js sends it with each tooltip) */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 700 calc(var(--text) * 11px)/1.35 "Malgun Gothic", "Segoe UI", system-ui, sans-serif; color: #e7e3da; user-select: none; }
  /* the box's size must not depend on the window's: width = its own content (capped),
     otherwise sizing the window to the box re-wraps the text and the two chase each other */
  #tip {
    position: absolute; left: 0; top: 0; width: max-content; max-width: calc(var(--text) * 300px); padding: 6px 8px; border-radius: 9px;
    background: rgba(14, 17, 22, .94); border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .t { color: #fff; font-size: calc(var(--text) * 11.5px); margin-bottom: 3px; display: flex; gap: 6px; align-items: baseline; }
  .t .sub { color: #9aa0ad; font-size: calc(var(--text) * 10px); font-weight: 400; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 0 5px 0 0; white-space: nowrap; }
  th { color: #9aa0ad; font-weight: 400; font-size: calc(var(--text) * 10px); text-align: right; }
  th:first-child, td.l { text-align: left; }
  td.r { text-align: right; }
  .kv td:first-child { color: #9aa0ad; font-weight: 400; padding-right: 10px; }
  .good { color: #4fd68f; } .bad { color: #ff6b5e; } .warn { color: #ffd34a; } .dim { color: #9aa0ad; font-weight: 400; }
  .it { color: #ffa63b; } .strong { color: #fff; font-size: calc(var(--text) * 12px); }
  .line { white-space: pre-wrap; }
  .note { color: #9aa0ad; font-weight: 400; font-size: calc(var(--text) * 10px); margin-top: 3px; white-space: pre-wrap; }
  .sep { height: 1px; background: rgba(255,255,255,.12); margin: 4px 0; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin: 3px 0 1px; }
  .spark span { width: 10px; background: #4fd68f; border-radius: 1px; min-height: 1px; }
  .spark span.neg { background: #ff6b5e; }
  .spark span.cur { outline: 1px solid #fff; }
  .sparklab { display: flex; gap: 2px; font-size: calc(var(--text) * 8.5px); color: #9aa0ad; font-weight: 400; }
  .sparklab span { width: 10px; text-align: center; }
  .hint { color: #6f7685; font-size: calc(var(--text) * 9.5px); font-weight: 400; margin-top: 2px; }
</style>
</head>
<body>
<div id="tip"></div>
<script src="tip.js"></script>
</body>
</html>
