<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>위치 안내</title>
<style>
  /* Drawn over the game window while an overlay is dragged by its ☰ (dock.js):
     snap lines, the game UI it must not cover, and where it would land. Click-through. */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font: 700 12px/1.3 "Malgun Gothic", "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  #frame { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.18); }
  .line { position: absolute; border: 0 dashed rgba(255,211,74,.45); }
  .line.v { top: 0; bottom: 0; width: 0; border-left-width: 1px; }
  .line.h { left: 0; right: 0; height: 0; border-top-width: 1px; }
  .line.on { border-color: #ffd34a; border-style: solid; box-shadow: 0 0 6px rgba(255,211,74,.8); }
  .zone { position: absolute; background: rgba(255,80,70,.12); border: 1px dashed rgba(255,107,94,.6); border-radius: 4px; }
  .zone.other { background: rgba(124,196,255,.10); border-color: rgba(124,196,255,.55); }
  .zone.hit { background: rgba(255,80,70,.38); border: 2px solid #ff6b5e; }
  .zone span { position: absolute; left: 4px; top: 2px; font-size: 10.5px; color: #ffb3ab; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; }
  .zone.other span { color: #b9ddff; }
  #box { position: absolute; border: 2px dashed #ffd34a; border-radius: 6px; }
  #box.bad { border-color: #ff6b5e; }
  /* the edge the content sticks to (dock.js anchor): solid and thicker */
  #box.top { border-top: 4px solid #ffd34a; }
  #box.bottom { border-bottom: 4px solid #ffd34a; }
  #box.bad.top, #box.bad.bottom { border-color: #ff6b5e; }
  #label {
    position: absolute; padding: 2px 8px; border-radius: 8px; white-space: nowrap; font-size: 11.5px;
    background: rgba(14,17,22,.92); border: 1px solid rgba(255,255,255,.2); text-shadow: none;
  }
  #label.bad { color: #ffb3ab; border-color: #ff6b5e; }
</style>
</head>
<body>
<div id="frame"></div>
<div id="layer"></div>
<div id="box"></div>
<div id="label"></div>
<script src="guide.js"></script>
</body>
</html>
